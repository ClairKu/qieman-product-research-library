  <style>
    :root{
      --ink:#171525;--muted:#6e7485;--paper:#f7f6fb;--card:#fff;--line:#e4e1ec;
      --accent:#8067e8;--accent-2:#a891ff;--accent-soft:#eeeaff;--teal:#38b5a5;
      --amber:#d38b21;--rose:#d75873;--navy:#111629;--navy-2:#1b213a;--navy-3:#242b49;
      --serif:"Songti SC","Noto Serif SC",STSong,SimSun,serif;
      --sans:"Songti SC","Noto Serif SC",STSong,SimSun,serif;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:14px;line-height:1.55}
    button{font:inherit}
    .skip{position:fixed;left:14px;top:-56px;z-index:100;padding:9px 12px;border-radius:10px;background:#fff;color:var(--ink)}
    .skip:focus{top:12px}
    .page{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;background:radial-gradient(circle at 80% -10%,rgba(169,145,255,.25),transparent 28%),var(--paper)}
    .masthead{position:relative;z-index:4;padding:17px 18px 13px;border-bottom:1px solid var(--line);background:rgba(250,249,253,.92);backdrop-filter:blur(18px)}
    .eyebrow{font:800 10px/1.2 var(--sans);letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
    h1{margin:7px 0 4px;font-size:clamp(25px,2.7vw,42px);line-height:1.06;letter-spacing:-.035em;font-weight:600}
    .subhead{margin:0;color:var(--muted);font-size:12px}
    .journey{min-height:0;display:grid;grid-template-columns:minmax(310px,26vw) minmax(0,1fr);gap:0}
    .timeline-panel{position:relative;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;border-right:1px solid var(--line);background:#fff}
    .timeline-head{padding:13px 18px 10px;border-bottom:1px solid var(--line)}
    .timeline-head h2{margin:0;font-size:18px;font-weight:600}
    .streams{display:flex;align-items:center;justify-content:space-between;gap:7px;width:100%;margin:0}
    .stream{display:flex;align-items:center;gap:4px;min-width:0;padding:0;background:transparent;color:#5c5570;font:700 8px var(--sans);white-space:nowrap}
    .stream:before{content:"";width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:var(--stream,#8d92a1)}
    .stream.release{--stream:var(--accent)}.stream.ecosystem{--stream:var(--teal)}.stream.brand{--stream:#5577d5}.stream.landmark{--stream:var(--amber)}
    .milestone-list{position:relative;min-height:0;overflow:auto;padding:7px 10px 10px;scrollbar-width:none;overscroll-behavior:contain;scroll-padding-block-start:7px}
    .milestone-list::-webkit-scrollbar{display:none}
    .milestone{position:relative;isolation:isolate;display:block;width:100%;margin:0 0 4px;padding:8px 10px 7px 12px;overflow:hidden;border:1px solid transparent;border-radius:11px;background:transparent;color:inherit;text-align:left;cursor:pointer;transition:background .18s ease,border-color .18s ease,box-shadow .18s ease}
    .milestone:before{content:"";position:absolute;z-index:2;left:0;top:10px;bottom:10px;width:3px;border-radius:0 99px 99px 0;background:var(--accent);opacity:0;transform:scaleY(.45);transform-origin:center;transition:opacity .18s ease,transform .18s ease}
    .milestone:hover{background:#faf8ff;border-color:#eee9f8}
    .milestone:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(128,103,232,.24)}
    .milestone.active{background:linear-gradient(90deg,#f5f1ff,#fbfaff 76%);border-color:#d9cff7;box-shadow:0 8px 22px rgba(73,54,127,.08)}
    .milestone.active:focus-visible{box-shadow:0 8px 22px rgba(73,54,127,.08),0 0 0 2px rgba(128,103,232,.20)}
    .milestone.active:before{opacity:1;transform:scaleY(1)}
    .milestone[data-key="true"]:not(.active){background:linear-gradient(90deg,#fffbf3,#fff 82%);border-color:#f3ecdf}
    .month-label{display:inline-block;margin:0 0 5px;color:#817b91;font:800 10px/1.1 var(--sans);letter-spacing:.045em;font-variant-numeric:tabular-nums;white-space:nowrap;transition:color .18s ease}
    .milestone.active .month-label{color:#6f55d1}
    .event-items{display:grid;gap:3px;min-width:0}
    .event-item{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;align-items:center;min-height:27px;min-width:0}
    .event-chip{display:inline-flex;justify-content:center;align-items:center;min-height:24px;padding:4px 7px;border-radius:999px;background:#eee9ff;color:#6f55ca;font:800 9px/1.1 var(--sans);white-space:nowrap}
    .event-item[data-type="生态建设"] .event-chip{background:#dff7f2;color:#187f73}
    .event-item[data-type="品牌运营"] .event-chip{background:#e7edff;color:#4665b7}
    .event-item[data-type="里程碑"] .event-chip{background:#fff0d9;color:#a35f0b}
    .event-text{display:block;min-width:0;overflow:hidden;color:#29263b;font:600 11px/1.35 var(--sans);white-space:nowrap;text-overflow:ellipsis}
    .event-item[data-type="里程碑"] .event-text{color:#352411;font-weight:750}
    .timeline-foot{display:flex;align-items:center;padding:10px 18px 12px;border-top:1px solid #eeeaf5;background:#fff}
    .chart-panel{position:relative;min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;background:radial-gradient(circle at 84% 3%,rgba(128,103,232,.23),transparent 29%),linear-gradient(145deg,var(--navy),var(--navy-2) 62%,#151a31);color:#fff}
    .chart-head{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;height:112px;min-height:112px;padding:12px 18px;overflow:hidden}
    .chart-head>div:first-child{min-width:0}
    .chart-head h2{margin:0;max-width:760px;font-size:clamp(20px,2.2vw,32px);line-height:1.18;font-weight:600;letter-spacing:-.02em}
    .chart-head p{margin:4px 0 0;max-width:min(760px,64vw);overflow:hidden;color:#adb5ca;font-size:11px;line-height:1.45;white-space:nowrap;text-overflow:ellipsis}
    .event-readings{display:grid;grid-template-columns:repeat(3,minmax(112px,1fr));min-width:390px;text-align:left;white-space:nowrap}
    .event-readings div{min-width:0;padding:4px 18px 3px;overflow:hidden}
    .event-readings div+div{border-left:1px solid rgba(255,255,255,.14)}
    .event-readings span{display:block;overflow:hidden;color:#bcb2ee;font:800 9px var(--sans);letter-spacing:.08em;text-overflow:ellipsis}
    .event-readings strong{display:block;margin-top:5px;color:#fff;font:600 clamp(24px,2.25vw,38px)/.95 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.025em}
    .chart-wrap{position:relative;min-height:0;padding:0 18px 5px;touch-action:none;cursor:crosshair}
    #trend-chart{display:block;width:100%;height:100%;min-height:270px;overflow:visible}
    .chart-tooltip{position:absolute;z-index:4;display:none;min-width:142px;padding:8px 10px;border:1px solid rgba(255,255,255,.13);border-radius:10px;background:rgba(8,11,24,.94);box-shadow:0 14px 34px rgba(0,0,0,.25);pointer-events:none;color:#fff;font:600 10px/1.6 var(--sans)}
    .chart-tooltip b{display:inline-block;margin-bottom:3px;padding:1px 6px;border-radius:999px;background:rgba(168,145,255,.14);color:#c9bdff}.chart-tooltip span{display:block;color:#c2c8d8}
    .chart-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 18px 15px;color:#8791aa;font:600 8px var(--sans)}
    .metric-toggles{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    .metric-toggle{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.035);color:#929bb1;cursor:pointer;font:700 9px var(--sans);transition:.18s ease}
    .metric-toggle:before{content:"";width:14px;height:3px;border-radius:99px;background:var(--metric-color)}
    .metric-toggle[aria-pressed="true"]{border-color:color-mix(in srgb,var(--metric-color) 55%,transparent);background:color-mix(in srgb,var(--metric-color) 13%,transparent);color:#f5f6fb}
    .metric-toggle[aria-pressed="false"]{opacity:.43;text-decoration:line-through}
    .metric-toggle:focus-visible{outline:2px solid #a891ff;outline-offset:2px}
    .metric-toggle.users{--metric-color:#a891ff}.metric-toggle.calling{--metric-color:#45c6b6}.metric-toggle.new-users{--metric-color:#ffb04a}.metric-toggle.calls{--metric-color:#7f90c4}
    .chart-meta{display:flex;align-items:center;gap:12px;white-space:nowrap}
    .cutoff{white-space:nowrap;color:#b3b9ca}
    .cutoff b{color:#fff}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(min-width:821px) and (max-width:1100px){
      .masthead{padding:12px 20px 10px}h1{font-size:28px}.subhead{font-size:10px}
      .chart-head{height:116px;min-height:116px;padding:8px 14px 50px;grid-template-columns:1fr}.chart-head h2{font-size:20px}.chart-head p{max-width:100%;font-size:9px;white-space:nowrap;text-overflow:ellipsis}.event-readings{position:absolute;left:14px;right:14px;bottom:6px;min-width:0;grid-template-columns:repeat(3,minmax(0,1fr))}.event-readings div{padding:3px 9px 2px}.event-readings span{font-size:7px}.event-readings strong{margin-top:2px;font-size:18px}
      .chart-wrap{padding:0 14px 5px}.chart-foot{grid-template-columns:1fr;padding:9px 14px 11px;gap:5px}.chart-meta{justify-content:space-between}
    }
    @media(max-width:820px){
      .masthead{padding:10px 14px 8px}h1{padding-right:0;font-size:22px}.subhead{font-size:9px;padding-right:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .journey{grid-template-columns:1fr;grid-template-rows:minmax(0,58%) minmax(0,42%)}
      .chart-panel{grid-row:1}.timeline-panel{grid-row:2;justify-self:center;width:min(100%,560px);border-right:0;border-top:1px solid var(--line)}
      .chart-head{height:112px;min-height:112px;padding:6px 12px 48px;grid-template-columns:1fr}.chart-head h2{font-size:17px}.chart-head p{display:block;max-width:100%;margin-top:2px;font-size:9px;line-height:1.35;white-space:nowrap;text-overflow:ellipsis}.event-readings{position:absolute;left:12px;right:12px;bottom:5px;min-width:0;grid-template-columns:repeat(3,minmax(0,1fr))}.event-readings div{min-width:0;padding:3px 8px 2px}.event-readings span{font-size:7px;white-space:nowrap}.event-readings strong{margin-top:2px;font-size:17px}
      .chart-wrap{padding:0 12px 4px}#trend-chart{min-height:180px}.chart-foot{grid-template-columns:1fr;padding:8px 12px 10px;gap:4px}.metric-toggles{gap:4px}.metric-toggle{padding:4px 6px;font-size:8px}.chart-meta{justify-content:space-between;gap:5px}.cutoff{font-size:7px}
      .timeline-head{padding:8px 14px 7px}.timeline-head h2{font-size:16px}.stream{font-size:8px}.milestone-list{padding:5px 7px 7px}.milestone{margin-bottom:2px;padding:7px 8px 7px 11px}.month-label{font-size:9px}.event-item{grid-template-columns:74px minmax(0,1fr);gap:7px}.event-chip{font-size:8px}.event-text{font-size:10px}.timeline-foot{padding:9px 10px 10px}
    }
    @media(max-width:440px){.event-readings{gap:3px}.event-readings strong{font-size:14px}.chart-head h2{padding-right:0}.chart-head p{max-width:100%}.metric-toggle{gap:4px;padding:3px 5px}.metric-toggle:before{width:9px}.event-text{font-size:10px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
    @media print{html,body{height:auto;overflow:visible}.page{height:auto}.journey{min-height:720px}}
  </style>
</head>

  <script>
    (()=>{
      const report=JSON.parse(document.getElementById("report-data").textContent);
      const metrics=JSON.parse(document.getElementById("metrics-data").textContent);
      const events=[...report.sections[0].items].sort((a,b)=>a.date.localeCompare(b.date));
      const rows=metrics.rows;
      const $=id=>document.getElementById(id);
      const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
      const fmt=value=>Number.isFinite(value)?new Intl.NumberFormat("zh-CN").format(value):"—";
      const parseDate=value=>Date.parse(`${value}T00:00:00+08:00`);
      const firstTime=parseDate(rows[0].date);
      const cutoffTime=parseDate(metrics.asOf);
      const endTime=cutoffTime;
      const chartMargin={top:24,right:104,bottom:58,left:44};
      const activeEventColor="#9884ff";
      const enabledMetrics=new Set(["users","calling","newUsers","calls"]);
      const newUserValues=rows.map(row=>row.dailyNewUsers).filter(Number.isFinite).sort((a,b)=>a-b);
      const newUserPeak=newUserValues[Math.floor(newUserValues.length*.95)]||42;
      let activeIndex=0;
      let programmaticScroll=false;
      let manualScrollFrame=0;
      let alignFrame=0;
      let alignTarget=0;
      let alignEpoch=0;
      let touchStart=null;
      let hoverFrame=0;

      const list=$("milestone-list");
      list.innerHTML=events.map((event,index)=>`<button class="milestone" type="button" data-index="${index}" data-category="${esc(event.category)}" data-key="${event.key===true}" aria-label="${esc(event.displayDate)} ${esc(event.title)}"><span class="month-label">${esc(event.displayDate)}</span><span class="event-items" role="list">${event.entries.map(item=>`<span class="event-item" data-type="${esc(item.type)}" role="listitem"><span class="event-chip">${esc(item.label)}</span><span class="event-text" title="${esc(item.text)}">${esc(item.text)}</span></span>`).join("")}</span></button>`).join("");
      const milestoneNodes=[...list.querySelectorAll(".milestone")];
      const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
      function cancelAlignment(){
        alignEpoch+=1;
        cancelAnimationFrame(alignFrame);
        alignFrame=0;
        programmaticScroll=false;
      }
      function alignMilestoneToTop(index,{smooth=true}={}){
        const node=milestoneNodes[index];
        if(!node)return;
        const inset=innerWidth<=820?5:7;
        const max=Math.max(0,list.scrollHeight-list.clientHeight);
        alignTarget=Math.max(0,Math.min(max,node.offsetTop-inset));
        const epoch=++alignEpoch;
        cancelAnimationFrame(alignFrame);
        programmaticScroll=true;
        if(!smooth||reduceMotion){
          list.scrollTop=alignTarget;
          requestAnimationFrame(()=>{if(epoch===alignEpoch)programmaticScroll=false});
          return;
        }
        const step=()=>{
          if(epoch!==alignEpoch)return;
          const delta=alignTarget-list.scrollTop;
          if(Math.abs(delta)<.6){
            list.scrollTop=alignTarget;
            alignFrame=0;
            requestAnimationFrame(()=>{if(epoch===alignEpoch)programmaticScroll=false});
            return;
          }
          list.scrollTop+=delta*.28;
          alignFrame=requestAnimationFrame(step);
        };
        alignFrame=requestAnimationFrame(step);
      }
      function nearestRow(date){
        const target=parseDate(date);
        let low=0,high=rows.length-1;
        while(low<high){const mid=Math.floor((low+high)/2);if(parseDate(rows[mid].date)<target)low=mid+1;else high=mid}
        const left=Math.max(0,low-1);return Math.abs(parseDate(rows[left].date)-target)<=Math.abs(parseDate(rows[low].date)-target)?rows[left]:rows[low];
      }

      function setActive(index,{align=true,announce=true,live=false,smooth=true}={}){
        activeIndex=Math.max(0,Math.min(events.length-1,index));
        const event=events[activeIndex];
        milestoneNodes.forEach((node,nodeIndex)=>{
          const active=nodeIndex===activeIndex;
          node.classList.toggle("active",active);
          node.setAttribute("aria-current",active?"step":"false");
        });
        if(align)alignMilestoneToTop(activeIndex,{smooth});
        $("active-body").textContent=`${event.title}｜${event.body}`;
        if(announce)renderChart();
      }

      function pathFor(values,xScale,yScale){
        let path="",started=false;
        values.forEach(({time,value})=>{
          if(!Number.isFinite(value)){started=false;return}
          const point=`${xScale(time).toFixed(2)},${yScale(value).toFixed(2)}`;
          path+=`${started?"L":"M"}${point}`;started=true;
        });
        return path;
      }

      function renderChart(){
        const svg=$("trend-chart");
        const W=1200,H=620;
        const margin=chartMargin;
        const innerW=W-margin.left-margin.right,innerH=H-margin.top-margin.bottom;
        const x=time=>margin.left+(time-firstTime)/(endTime-firstTime)*innerW;
        const yUsers=value=>margin.top+innerH-(value/9000)*innerH;
        const yActive=value=>margin.top+innerH-(value/450)*innerH;
        const yNew=value=>margin.top+innerH-(value/180)*innerH;
        const yCalls=value=>margin.top+innerH-(value/10000000)*innerH;
        const userValues=rows.map(row=>({time:parseDate(row.date),value:row.cumulativeUsers}));
        const activeValues=rows.map(row=>({time:parseDate(row.date),value:row.dailyCallingUsers}));
        const callValues=rows.map(row=>({time:parseDate(row.date),value:row.cumulativeCalls}));
        const userPath=pathFor(userValues,x,yUsers);
        const activePath=pathFor(activeValues,x,yActive);
        const callPath=pathFor(callValues,x,yCalls);
        const lastUser=userValues.findLast(item=>Number.isFinite(item.value));
        const area=`${userPath}L${x(lastUser.time).toFixed(2)},${(margin.top+innerH).toFixed(2)}L${x(firstTime).toFixed(2)},${(margin.top+innerH).toFixed(2)}Z`;
        const ratioTicks=[0,.25,.5,.75,1];
        const userTicks=["","2.3k","4.5k","6.8k","9k"];
        const newTicks=["","45","90","135","180"];
        const activeTicks=["","113","225","338","450"];
        const monthTicks=[];
        for(let year=2025,month=3;year<2027;){
          const value=`${year}-${String(month).padStart(2,"0")}-01`;const time=parseDate(value);
          if(time>=firstTime&&time<=endTime)monthTicks.push({time,label:month===1?`${year}\n01`:String(month).padStart(2,"0")});
          month+=1;if(month===13){month=1;year+=1}
        }
        const event=events[activeIndex];
        const eventTime=Math.min(endTime,Math.max(firstTime,parseDate(event.date)));
        const selectedRow=nearestRow(event.date);
        const previousTime=activeIndex===0?firstTime:(parseDate(events[activeIndex-1].date)+eventTime)/2;
        const nextTime=activeIndex===events.length-1?endTime:(eventTime+parseDate(events[activeIndex+1].date))/2;
        const bandX=x(Math.max(firstTime,previousTime));
        const bandWidth=x(Math.min(endTime,nextTime))-bandX;
        const grid=ratioTicks.map((ratio,index)=>{const y=margin.top+innerH*(1-ratio);return `<line x1="${margin.left}" y1="${y}" x2="${W-margin.right}" y2="${y}" stroke="rgba(255,255,255,.08)"/><text x="${margin.left-9}" y="${y+4}" text-anchor="end" fill="#a891ff" font-size="9" font-family="Songti SC,STSong,serif">${userTicks[index]}</text><text x="${W-margin.right+9}" y="${y+4}" fill="#ffb04a" font-size="9" font-family="Songti SC,STSong,serif">${newTicks[index]}</text><text x="${W-margin.right+49}" y="${y+4}" fill="#45c6b6" font-size="9" font-family="Songti SC,STSong,serif">${activeTicks[index]}</text>`}).join("");
        const xAxis=monthTicks.map(({time,label},index)=>{const [top,bottom]=label.split("\n");return `<line x1="${x(time)}" y1="${margin.top}" x2="${x(time)}" y2="${H-margin.bottom}" stroke="rgba(255,255,255,.035)"/><text x="${x(time)}" y="${H-margin.bottom+22}" text-anchor="middle" fill="${bottom?"#b9c0d2":"#7d87a0"}" font-size="${bottom?12:10}" font-family="Songti SC,STSong,serif">${top}</text>${bottom?`<text x="${x(time)}" y="${H-margin.bottom+39}" text-anchor="middle" fill="#7d87a0" font-size="10" font-family="Songti SC,STSong,serif">${bottom}</text>`:""}`}).join("");
        const dailyBars=enabledMetrics.has("newUsers")?rows.map(row=>{
          if(!Number.isFinite(row.dailyNewUsers))return "";
          const peak=row.dailyNewUsers>=newUserPeak;
          const top=yNew(row.dailyNewUsers),height=margin.top+innerH-top;
          return `<rect x="${(x(parseDate(row.date))-1.35).toFixed(2)}" y="${top.toFixed(2)}" width="2.7" height="${Math.max(0,height).toFixed(2)}" rx="1.2" fill="${peak?"#ffc56e":"#e79536"}" opacity="${peak ? .92 : .23}"/>`;
        }).join(""):"";
        svg.innerHTML=`
          <defs>
            <linearGradient id="user-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a891ff" stop-opacity=".38"/><stop offset="1" stop-color="#a891ff" stop-opacity=".02"/></linearGradient>
            <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          ${grid}${xAxis}
          <rect x="${bandX.toFixed(2)}" y="${margin.top}" width="${Math.max(0,bandWidth).toFixed(2)}" height="${innerH}" rx="8" fill="${activeEventColor}" opacity=".075"/>
          ${dailyBars}
          ${enabledMetrics.has("users")?`<path d="${area}" fill="url(#user-area)"/><path d="${userPath}" fill="none" stroke="#a891ff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>`:""}
          ${enabledMetrics.has("calling")?`<path d="${activePath}" fill="none" stroke="#45c6b6" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>`:""}
          ${enabledMetrics.has("calls")?`<path d="${callPath}" fill="none" stroke="#7f90c4" stroke-width="1.35" stroke-linejoin="round" stroke-linecap="round" opacity=".46"/>`:""}
          <line x1="${x(eventTime)}" y1="${margin.top}" x2="${x(eventTime)}" y2="${H-margin.bottom}" stroke="${activeEventColor}" stroke-width="1.35" opacity=".55"/>
          <g id="focus-overlay"></g>
        `;
        if(selectedRow)renderFocus(selectedRow,{quiet:true});
      }

      function renderFocus(row,{quiet=false}={}){
        const group=$("focus-overlay");
        if(!group||!row)return;
        const W=1200,H=620;
        const margin=chartMargin;
        const innerW=W-margin.left-margin.right,innerH=H-margin.top-margin.bottom;
        const x=time=>margin.left+(time-firstTime)/(endTime-firstTime)*innerW;
        const yUsers=value=>margin.top+innerH-(value/9000)*innerH;
        const yActive=value=>margin.top+innerH-(value/450)*innerH;
        const yNew=value=>margin.top+innerH-(value/180)*innerH;
        const yCalls=value=>margin.top+innerH-(value/10000000)*innerH;
        const focusX=x(parseDate(row.date));
        const anchor=(metric,y,color,radius)=>enabledMetrics.has(metric)&&Number.isFinite(y)?`<circle cx="${focusX}" cy="${y}" r="${radius+5}" fill="${color}" opacity=".16"/><circle cx="${focusX}" cy="${y}" r="${radius}" fill="${color}" stroke="#fff" stroke-width="2"/>`:"";
        group.innerHTML=`${anchor("users",yUsers(row.cumulativeUsers),"#a891ff",5.5)}${anchor("calling",yActive(row.dailyCallingUsers),"#45c6b6",4.7)}${anchor("newUsers",yNew(row.dailyNewUsers),"#ffb04a",4.2)}${anchor("calls",yCalls(row.cumulativeCalls),"#7f90c4",3.6)}`;
      }

      function nearestEventIndexFromDate(time){
        let best=0,distance=Infinity;
        events.forEach((event,index)=>{const delta=Math.abs(parseDate(event.date)-time);if(delta<distance){best=index;distance=delta}});
        return best;
      }

      function chartDateFromPointer(clientX){
        const rect=$("trend-chart").getBoundingClientRect();
        const svgX=(clientX-rect.left)/rect.width*1200;
        const ratio=Math.max(0,Math.min(1,(svgX-chartMargin.left)/(1200-chartMargin.left-chartMargin.right)));
        return firstTime+ratio*(endTime-firstTime);
      }

      list.addEventListener("pointerover",event=>{
        if(programmaticScroll)return;
        const item=event.target.closest(".milestone");
        if(!item||item.contains(event.relatedTarget))return;
        setActive(Number(item.dataset.index),{align:false,live:true});
      });
      list.addEventListener("click",event=>{const item=event.target.closest(".milestone");if(item)setActive(Number(item.dataset.index),{live:true})});
      list.addEventListener("wheel",cancelAlignment,{passive:true});
      list.addEventListener("touchstart",cancelAlignment,{passive:true});
      list.addEventListener("scroll",()=>{
        if(programmaticScroll)return;
        cancelAnimationFrame(manualScrollFrame);
        manualScrollFrame=requestAnimationFrame(()=>{
          const anchor=list.getBoundingClientRect().top+(innerWidth<=820?5:7);
          let best=0;
          milestoneNodes.forEach((node,index)=>{if(node.getBoundingClientRect().top<=anchor+2)best=index});
          if(best!==activeIndex)setActive(best,{align:false,live:true});
        });
      },{passive:true});

      const chartWrap=$("chart-wrap");
      document.querySelectorAll(".metric-toggle").forEach(button=>button.addEventListener("click",()=>{
        const metric=button.dataset.metric;
        if(enabledMetrics.has(metric))enabledMetrics.delete(metric);else enabledMetrics.add(metric);
        button.setAttribute("aria-pressed",String(enabledMetrics.has(metric)));
        renderChart();
      }));
      chartWrap.addEventListener("wheel",event=>{event.preventDefault();cancelAlignment();list.scrollTop+=event.deltaY||event.deltaX},{passive:false});
      chartWrap.addEventListener("pointermove",event=>{
        if(event.pointerType==="touch")return;
        cancelAnimationFrame(hoverFrame);
        hoverFrame=requestAnimationFrame(()=>{
          const time=chartDateFromPointer(event.clientX);
          const nearby=nearestEventIndexFromDate(time);
          if(nearby!==activeIndex)setActive(nearby,{align:true,live:false});
          const row=nearestRow(new Date(time).toISOString().slice(0,10));
          renderFocus(row);
          const tip=$("chart-tooltip");
          tip.innerHTML=`<b>${row.date}</b><span>累计申请 ${fmt(row.cumulativeUsers)}</span><span>每日调用 ${fmt(row.dailyCallingUsers)}</span><span>每日新增 ${fmt(row.dailyNewUsers)}</span><span>总调用量 ${fmt(row.cumulativeCalls)}</span>`;
          tip.style.display="block";
          const rect=chartWrap.getBoundingClientRect();
          tip.style.left=`${Math.max(8,Math.min(rect.width-tip.offsetWidth-8,event.clientX-rect.left+12))}px`;
          tip.style.top=`${Math.max(8,Math.min(rect.height-tip.offsetHeight-8,event.clientY-rect.top-18))}px`;
        });
      });
      chartWrap.addEventListener("pointerleave",()=>{cancelAnimationFrame(hoverFrame);$("chart-tooltip").style.display="none";renderChart()});
      chartWrap.addEventListener("touchstart",event=>{const touch=event.touches[0];touchStart={x:touch.clientX,y:touch.clientY,scroll:list.scrollTop}},{passive:true});
      chartWrap.addEventListener("touchmove",event=>{if(!touchStart)return;event.preventDefault();const touch=event.touches[0];const time=chartDateFromPointer(touch.clientX);const nearby=nearestEventIndexFromDate(time);if(nearby!==activeIndex)setActive(nearby,{align:true,live:false});if(time<=cutoffTime){const row=nearestRow(new Date(time).toISOString().slice(0,10));renderFocus(row)}},{passive:false});
      chartWrap.addEventListener("touchend",()=>{touchStart=null},{passive:true});
      addEventListener("keydown",event=>{
        if(event.defaultPrevented||event.metaKey||event.ctrlKey||event.altKey||event.target.closest("input,textarea,select,button,a"))return;
        if(["ArrowUp","ArrowLeft","PageUp"].includes(event.key)){event.preventDefault();setActive(activeIndex-1,{live:true})}
        if(["ArrowDown","ArrowRight","PageDown"].includes(event.key)){event.preventDefault();setActive(activeIndex+1,{live:true})}
        if(event.key==="Home"){event.preventDefault();setActive(0,{live:true})}
        if(event.key==="End"){event.preventDefault();setActive(events.length-1,{live:true})}
      });
      addEventListener("resize",()=>{alignMilestoneToTop(activeIndex,{smooth:false});renderChart()},{passive:true});
      const initialIndex=Math.max(0,events.findLastIndex(event=>parseDate(event.date)<=cutoffTime));
      setActive(initialIndex,{smooth:false});
      requestAnimationFrame(()=>setActive(initialIndex,{smooth:false}));
    })();
  </script>
</body>
</html>
