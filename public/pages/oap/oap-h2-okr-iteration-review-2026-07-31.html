    const fromB64=value=>Uint8Array.from(atob(value),character=>character.charCodeAt(0));
    document.getElementById("unlock-form").addEventListener("submit",async(event)=>{
      event.preventDefault();
      const error=document.getElementById("error");
      const button=event.currentTarget.querySelector("button");
      error.textContent="";
      button.disabled=true;
      button.textContent="正在解锁…";
      try{
        const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("password").value),"PBKDF2",false,["deriveKey"]);
        const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:fromB64(payload.salt),iterations:210000,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"]);
        const bytes=fromB64(payload.data);
        const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(payload.iv)},key,bytes);
        document.open();
        document.write(new TextDecoder().decode(plain));
        document.close();
      }catch{
        error.textContent="密码不正确，请重新输入。";
        button.disabled=false;
        button.textContent="进入报告";
      }
