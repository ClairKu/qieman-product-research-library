:root {
  --ink: #0b1020;
  --ink-soft: #151c32;
  --paper: #f4f6fb;
  --white: #ffffff;
  --line: #dbe0ea;
  --muted: #65708a;
  --mint: #5eead4;
  --amber: #ffb45c;
  --periwinkle: #8b9cff;
  --danger: #ff6b6b;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; }
button { cursor: pointer; }

.gate {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--ink);
  position: relative;
  overflow: hidden;
}
.gate::before, .gate::after {
  content: "";
  position: absolute;
  border: 1px solid #2a3555;
  border-radius: 50%;
}
.gate::before { width: 620px; height: 620px; left: -300px; top: -280px; }
.gate::after { width: 420px; height: 420px; right: -180px; bottom: -210px; }
.gate-card {

  padding: 52px;
  background: #11182b;
  border: 1px solid #2a3555;
  box-shadow: 0 24px 80px #0008;
  color: white;
  position: relative;
  z-index: 1;
}
.gate-mark, .brand span {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  background: var(--mint);
  color: var(--ink);
  font-weight: 900;
  letter-spacing: -1px;
}
.gate-card h1 { margin: 22px 0 16px; font-size: clamp(34px, 7vw, 54px); line-height: 1.08; letter-spacing: -2px; }
.gate-copy { color: #aeb8ce; line-height: 1.8; max-width: 460px; }
.gate-card form { margin-top: 34px; }
.gate-card label { display: block; color: #cfd6e6; margin-bottom: 10px; font-size: 14px; }
.password-row { display: flex; gap: 10px; }
.password-row input {
  min-width: 0;
  flex: 1;
  border: 1px solid #33415f;
  background: #0c1222;
  color: white;
  padding: 14px 16px;
  outline: none;

.password-row input:focus { border-color: var(--mint); }
.password-row button { border: 0; background: var(--mint); color: var(--ink); font-weight: 800; padding: 0 22px; }
.form-message { min-height: 21px; margin: 10px 0 0; color: #73809b; font-size: 13px; }
.form-message.error { color: #ff8f8f; }

.hero { background: var(--ink); color: white; padding: 0 max(28px, calc((100vw - 1200px) / 2)); }
nav {
  height: 82px;
  display: flex;
  align-items: center;
  gap: 32px;
  border-bottom: 1px solid #232d48;
}
.brand { display: flex; align-items: center; gap: 12px; font-weight: 800; margin-right: auto; }
.brand span { width: 34px; height: 34px; font-size: 12px; }
.nav-links { display: flex; gap: 28px; color: #abb6cc; font-size: 14px; }
.nav-links a:hover { color: var(--mint); }
.lock-button { border: 1px solid #33415f; background: transparent; color: #abb6cc; padding: 8px 12px; }
.hero-grid {
  min-height: 650px;
  display: grid;
  grid-template-columns: 1.12fr .88fr;
  gap: 70px;
  align-items: center;
  padding: 78px 0 92px;
}
.eyebrow { margin: 0 0 14px; font-size: 12px; font-weight: 900; letter-spacing: 1.8px; color: #56627a; }

.hero h1 { margin: 0; font-size: clamp(54px, 7vw, 88px); line-height: .98; letter-spacing: -5px; font-weight: 850; }
.hero h1 em { color: var(--mint); font-style: normal; }
.hero-copy { max-width: 640px; color: #b3bed2; font-size: 18px; line-height: 1.8; margin: 32px 0; }
.hero-actions { display: flex; align-items: center; gap: 26px; }
.primary-button { background: var(--mint); color: var(--ink); padding: 14px 20px; font-weight: 850; }
.text-link { color: #ccd4e4; }
.signal-card { align-self: center; min-height: 390px; background: #11182b; border: 1px solid #293451; padding: 30px; }
.signal-head { display: flex; justify-content: space-between; align-items: start; color: #aeb9cc; }
.signal-head strong { color: var(--mint); font-size: 42px; letter-spacing: -2px; }
.signal-chart { height: 230px; display: flex; align-items: end; gap: 14px; border-bottom: 1px solid #33405e; padding-top: 28px; }
.signal-col { flex: 1; height: 100%; display: flex; align-items: end; gap: 8px; flex-direction: column; justify-content: end; }
.signal-col div { width: 100%; background: var(--mint); min-height: 8px; }
.signal-col span { color: #73809a; font-size: 10px; }
.signal-foot { display: flex; justify-content: space-between; color: #7d89a1; font-size: 12px; margin-top: 14px; }

.section { max-width: 1260px; margin: 0 auto; padding: 104px 30px; }
.kpi-section { padding-top: 78px; padding-bottom: 78px; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 46px; margin-bottom: 42px; }
.section-head.compact { align-items: center; margin-bottom: 28px; }
.section-head h2, .method-section h2 { margin: 0; font-size: clamp(34px, 5vw, 54px); line-height: 1.08; letter-spacing: -2.5px; }
.section-summary { max-width: 470px; margin: 0; color: var(--muted); line-height: 1.8; }
.segmented { display: flex; border: 1px solid var(--line); padding: 4px; background: white; }
.segmented button { border: 0; background: transparent; padding: 8px 18px; color: var(--muted); }
.segmented button.active { background: var(--ink); color: white; }
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.kpi-card { background: white; border: 1px solid var(--line); padding: 26px; }
.kpi-card span { color: var(--muted); font-size: 14px; }
.kpi-card strong { display: block; margin: 16px 0; font-size: clamp(30px, 4vw, 44px); letter-spacing: -2px; }
.kpi-card p { margin: 0; color: var(--muted); font-size: 13px; }
.kpi-card p b { color: #128779; margin-right: 4px; }
.metric-note { margin-top: 16px; padding: 16px 20px; border-left: 4px solid var(--amber); background: #fff8ed; color: #66543b; line-height: 1.7; }

.chart-card { background: white; border: 1px solid var(--line); padding: 26px 24px 20px; }
.chart-legend { display: flex; gap: 20px; justify-content: end; font-size: 12px; color: var(--muted); }
.chart-legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 7px; }
.legend-pv::before { background: var(--ink); }
.legend-uv::before { background: var(--mint); }
.monthly-chart { height: 350px; display: flex; align-items: end; gap: 10px; padding-top: 32px; }
.month-col { flex: 1; height: 100%; min-width: 0; display: flex; flex-direction: column; justify-content: end; gap: 8px; }
.bars { flex: 1; display: flex; align-items: end; justify-content: center; gap: 2px; border-bottom: 1px solid var(--line); }
.bar { width: 46%; min-height: 2px; }
.bar.pv { background: var(--ink); }
.bar.uv { background: var(--mint); }
.month-col > span { text-align: center; color: #7b8497; font-size: 10px; white-space: nowrap; }
.insight-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; }
.insight-grid article { padding: 24px; background: #e9edf7; border-top: 3px solid var(--ink); }

.insight-grid h3 { margin: 24px 0 8px; }
.insight-grid p { margin: 0; color: var(--muted); line-height: 1.65; font-size: 14px; }

.dark-section { max-width: none; background: var(--ink); color: white; padding-left: max(30px, calc((100vw - 1200px) / 2)); padding-right: max(30px, calc((100vw - 1200px) / 2)); }
.section-head.inverse .section-summary { color: #aab5cb; }

.action-card h3 { font-size: 24px; margin: 18px 0 14px; }
.action-card ul { margin: 0; padding-left: 20px; color: #535f75; line-height: 1.9; }

.method-section { display: grid; grid-template-columns: .7fr 1.3fr; gap: 70px; border-top: 1px solid var(--line); }
.method-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.method-grid article { border-top: 3px solid var(--ink); padding: 20px 0; }
.method-grid p { color: var(--muted); line-height: 1.7; font-size: 13px; }
.fine-print { grid-column: 2; color: #788296; font-size: 12px; line-height: 1.8; margin: 0; }
footer { background: var(--ink); color: #77839a; display: flex; justify-content: space-between; gap: 18px; padding: 28px max(30px, calc((100vw - 1200px) / 2)); font-size: 12px; }

@media (max-width: 900px) {
  .nav-links { display: none; }
  .hero-grid, .journey-grid, .data-grid, .method-section { grid-template-columns: 1fr; }
  .hero-grid { gap: 42px; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .section-head { align-items: start; flex-direction: column; gap: 18px; }
  .section-head.compact { flex-direction: row; align-items: center; }
  .insight-grid, .method-grid { grid-template-columns: 1fr; }
  .fine-print { grid-column: 1; }

@media (max-width: 620px) {

  .month-col { min-width: 28px; }
  .click-row { grid-template-columns: 28px 1fr 62px; }
  .click-row > span:nth-last-of-type(1) { display: none; }
  .source-list div { grid-template-columns: 1fr 78px 58px; }
  footer { flex-direction: column; }
}
